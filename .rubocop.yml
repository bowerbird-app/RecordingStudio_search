AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_search/engine.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_search/**/*'
    - 'db/migrate/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_search/**/*'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_search/engine.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/recording_studio_search/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/recording_studio_search/**/*'

Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'
    - 'config/routes.rb'

Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

Lint/MissingSuper:
  Exclude:
    - 'test/services/**/*'
